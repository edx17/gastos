# Configuración mínima para `supabase start` / `supabase db reset` en local.
project_id = "crocante"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/app/dashboard", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Para habilitar Google: cargar las credenciales y poner enabled = true.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[storage]
enabled = true
file_size_limit = "8MiB"

[functions.ai-complete]
verify_jwt = true

[functions.ocr-receipt]
verify_jwt = true

[functions.create-subscription]
verify_jwt = true

# Mercado Pago no manda un JWT de Supabase: la autenticidad se verifica con la
# firma del propio proveedor dentro de la función.
[functions.subscription-webhook]
verify_jwt = false
